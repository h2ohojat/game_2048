<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<meta name="description" content="بازی آفلاین 2048 - نسخه پایدار 1.0.0">
<title>2048 — Stable v1.0.0</title>
<style>
:root{--bg:#faf8ef;--text:#776e65;--muted:#8f7a66;--board:#bbada0;--empty:rgba(238,228,218,.35);--button:#8f7a66;--light:#f9f6f2}
*{box-sizing:border-box}html,body{margin:0;min-height:100%}body{min-height:100vh;padding:22px 14px;display:flex;justify-content:center;background:var(--bg);color:var(--text);font-family:Tahoma,Arial,sans-serif}.app{width:min(100%,520px)}.header{display:flex;justify-content:space-between;align-items:center;gap:14px}h1{margin:0;font-size:clamp(52px,15vw,78px);line-height:1;direction:ltr}.scores{display:flex;gap:8px;direction:ltr}.score-box{min-width:86px;padding:7px 12px;border-radius:7px;background:var(--board);color:white;text-align:center}.score-box span{display:block;font-size:11px;font-weight:bold;opacity:.85}.score-box strong{display:block;margin-top:3px;font-size:24px}.toolbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:16px 0}.toolbar p{margin:0;font-size:14px;line-height:1.75}button{border:0;border-radius:7px;padding:11px 16px;background:var(--button);color:white;font:inherit;font-weight:bold;cursor:pointer}button:active{transform:translateY(1px)}.board-wrap{position:relative;background:var(--board);padding:10px;border-radius:9px;touch-action:none;overscroll-behavior:contain}#board{display:grid;grid-template-columns:repeat(4,1fr);grid-template-rows:repeat(4,1fr);gap:10px;aspect-ratio:1;direction:ltr}.cell{min-width:0;min-height:0;border-radius:6px;background:var(--empty);display:flex;align-items:center;justify-content:center;font-size:clamp(24px,8vw,43px);font-weight:700;user-select:none;transition:background-color .12s ease,color .12s ease}.cell.spawn{animation:spawn .16s ease-out}.cell.merged{animation:merge .2s ease-out}@keyframes spawn{0%{transform:scale(.25);opacity:.2}100%{transform:scale(1);opacity:1}}@keyframes merge{0%{transform:scale(1)}50%{transform:scale(1.14)}100%{transform:scale(1)}}.t2{background:#eee4da}.t4{background:#ede0c8}.t8{background:#f2b179;color:#f9f6f2}.t16{background:#f59563;color:#f9f6f2}.t32{background:#f67c5f;color:#f9f6f2}.t64{background:#f65e3b;color:#f9f6f2}.t128{background:#edcf72;color:#f9f6f2;font-size:clamp(22px,7vw,38px)}.t256{background:#edcc61;color:#f9f6f2;font-size:clamp(22px,7vw,38px)}.t512{background:#edc850;color:#f9f6f2;font-size:clamp(22px,7vw,38px)}.t1024{background:#edc53f;color:#f9f6f2;font-size:clamp(18px,6vw,32px)}.t2048{background:#edc22e;color:#f9f6f2;font-size:clamp(18px,6vw,32px);box-shadow:0 0 20px rgba(237,194,46,.55)}.thigh{background:#3c3a32;color:#f9f6f2;font-size:clamp(16px,5vw,28px)}.overlay{position:absolute;inset:0;z-index:10;border-radius:9px;background:rgba(238,228,218,.86);display:none;align-items:center;justify-content:center;text-align:center;padding:24px}.overlay.show{display:flex;animation:fade .22s ease-out}@keyframes fade{from{opacity:0}to{opacity:1}}.overlay h2{font-size:clamp(30px,9vw,44px);margin:0 0 14px}.actions{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}#status{min-height:45px;margin-top:14px;padding:11px 13px;border-radius:7px;background:#eee4da;text-align:center;line-height:1.65;font-size:13px}.help{margin-top:15px;color:var(--muted);font-size:13px;line-height:1.8}footer{text-align:center;margin-top:16px;font-size:11px;opacity:.65;direction:ltr}@media(max-width:430px){body{padding:14px 10px}.header{flex-direction:column;align-items:stretch}.scores{width:100%}.score-box{flex:1}.toolbar{flex-direction:column;align-items:stretch}.toolbar button{width:100%}.board-wrap{padding:7px}#board{gap:7px}}@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<main class="app">
<header class="header"><h1>2048</h1><div class="scores" aria-label="امتیازها"><div class="score-box"><span>SCORE</span><strong id="score">0</strong></div><div class="score-box"><span>BEST</span><strong id="best">0</strong></div></div></header>
<section class="toolbar"><p>کاشی‌های هم‌عدد را ترکیب کن و به <strong>2048</strong> برس.</p><button id="new-game" type="button">بازی جدید</button></section>
<section class="board-wrap" id="touch-area" aria-label="صفحه بازی 2048"><div id="board" role="grid" aria-label="شبکه چهار در چهار"></div><div id="overlay" class="overlay" aria-live="assertive"><div><h2 id="overlay-title"></h2><div class="actions"><button id="continue-btn" type="button">ادامه بازی</button><button id="restart-overlay" type="button">بازی جدید</button></div></div></div></section>
<section id="status" aria-live="polite">آماده بازی</section>
<section class="help"><strong>روش بازی:</strong> در رایانه از کلیدهای جهت‌دار و در موبایل از کشیدن انگشت به بالا، پایین، چپ یا راست استفاده کن. وضعیت بازی به‌صورت خودکار روی همین مرورگر ذخیره می‌شود.</section>
<footer>2048 • v1.0.0 Stable • P09 Release</footer>
</main>
<script>
"use strict";
const SIZE=4;const STORAGE_KEY="game2048-state-v1";const BEST_KEY="game2048-best-v1";const cloneBoard=b=>b.map(r=>[...r]);const sameBoard=(a,b)=>a.every((r,i)=>r.every((v,j)=>v===b[i][j]));
const State={board:[],score:0,best:0,won:false,keepPlaying:false,over:false,lastSpawn:null,mergedCells:[]};
function emptyBoard(){return Array.from({length:SIZE},()=>Array(SIZE).fill(0))}
function validBoard(b){return Array.isArray(b)&&b.length===SIZE&&b.every(r=>Array.isArray(r)&&r.length===SIZE&&r.every(v=>Number.isInteger(v)&&v>=0))}
function emptyCells(){const cells=[];State.board.forEach((r,i)=>r.forEach((v,j)=>{if(v===0)cells.push([i,j])}));return cells}
function spawn(){const cells=emptyCells();if(!cells.length)return false;const [r,c]=cells[Math.floor(Math.random()*cells.length)];State.board[r][c]=Math.random()<.9?2:4;State.lastSpawn=[r,c];return true}
function processLine(line){const vals=line.map((v,index)=>({v,index})).filter(x=>x.v!==0);const out=[];let gain=0;const merged=[];for(let i=0;i<vals.length;i++){if(i+1<vals.length&&vals[i].v===vals[i+1].v){const value=vals[i].v*2;out.push(value);merged.push(out.length-1);gain+=value;i++}else out.push(vals[i].v)}while(out.length<SIZE)out.push(0);return{line:out,gain,merged}}
function transpose(b){return b[0].map((_,i)=>b.map(r=>r[i]))}
function leftResult(b){let gain=0;const mergedCells=[];const board=b.map((r,row)=>{const x=processLine(r);gain+=x.gain;x.merged.forEach(col=>mergedCells.push([row,col]));return x.line});return{board,gain,mergedCells}}
function rightResult(b){let gain=0;const mergedCells=[];const board=b.map((r,row)=>{const x=processLine([...r].reverse());gain+=x.gain;x.merged.forEach(col=>mergedCells.push([row,SIZE-1-col]));return x.line.reverse()});return{board,gain,mergedCells}}
function calculateMove(b,dir){if(dir==="left")return leftResult(b);if(dir==="right")return rightResult(b);const t=transpose(b);const x=dir==="up"?leftResult(t):rightResult(t);return{board:transpose(x.board),gain:x.gain,mergedCells:x.mergedCells.map(([r,c])=>[c,r])}}
function tileClass(v){if([2,4,8,16,32,64,128,256,512,1024,2048].includes(v))return "t"+v;return "thigh"}
const Renderer={render(){const board=document.getElementById("board");board.replaceChildren();for(let r=0;r<SIZE;r++)for(let c=0;c<SIZE;c++){const v=State.board[r][c];const el=document.createElement("div");el.className="cell";el.setAttribute("role","gridcell");if(v){el.textContent=v;el.classList.add(tileClass(v));el.setAttribute("aria-label","کاشی "+v)}else el.setAttribute("aria-label","خانه خالی");if(State.lastSpawn&&State.lastSpawn[0]===r&&State.lastSpawn[1]===c)el.classList.add("spawn");if(State.mergedCells.some(([mr,mc])=>mr===r&&mc===c))el.classList.add("merged");board.appendChild(el)}document.getElementById("score").textContent=State.score;document.getElementById("best").textContent=State.best}};
function save(){try{localStorage.setItem(BEST_KEY,String(State.best));localStorage.setItem(STORAGE_KEY,JSON.stringify({board:State.board,score:State.score,won:State.won,keepPlaying:State.keepPlaying,over:State.over}))}catch(_){}}
function load(){let best=0;try{best=Math.max(0,Number(localStorage.getItem(BEST_KEY))||0)}catch(_){}State.best=best;try{const raw=localStorage.getItem(STORAGE_KEY);if(!raw)return false;const s=JSON.parse(raw);if(!validBoard(s.board))return false;State.board=cloneBoard(s.board);State.score=Math.max(0,Number(s.score)||0);State.best=Math.max(State.best,State.score);State.won=Boolean(s.won);State.keepPlaying=Boolean(s.keepPlaying);State.over=Boolean(s.over);State.lastSpawn=null;State.mergedCells=[];return true}catch(_){return false}}
function fresh(){State.board=emptyBoard();State.score=0;State.won=false;State.keepPlaying=false;State.over=false;State.mergedCells=[];spawn();spawn();State.best=Math.max(State.best,State.score);hideOverlay();save();Renderer.render()}
function has2048(){return State.board.some(r=>r.some(v=>v>=2048))}
function movesAvailable(){if(emptyCells().length)return true;for(let r=0;r<SIZE;r++)for(let c=0;c<SIZE;c++){const v=State.board[r][c];if(c+1<SIZE&&v===State.board[r][c+1])return true;if(r+1<SIZE&&v===State.board[r+1][c])return true}return false}
function showOverlay(title,canContinue){document.getElementById("overlay-title").textContent=title;document.getElementById("continue-btn").style.display=canContinue?"inline-block":"none";document.getElementById("overlay").classList.add("show")}
function hideOverlay(){document.getElementById("overlay").classList.remove("show")}
function evaluate(){if(!State.won&&has2048()){State.won=true;save();showOverlay("بردی! 2048 ساخته شد",true);return "win"}if(!movesAvailable()){State.over=true;save();showOverlay("بازی تمام شد",false);return "over"}return "play"}
function setStatus(m){document.getElementById("status").textContent=m}
function move(dir){if(State.over||document.getElementById("overlay").classList.contains("show"))return false;State.lastSpawn=null;State.mergedCells=[];const result=calculateMove(State.board,dir);if(sameBoard(State.board,result.board)){setStatus("حرکت نامعتبر؛ کاشی جدید ساخته نشد.");evaluate();return false}State.board=result.board;State.score+=result.gain;State.best=Math.max(State.best,State.score);State.mergedCells=result.mergedCells;spawn();const status=evaluate();save();Renderer.render();if(status==="play")setStatus(result.gain?`ادغام انجام شد؛ +${result.gain} امتیاز.`:"حرکت معتبر؛ کاشی جدید اضافه شد.");return true}
const keyMap={ArrowLeft:"left",ArrowRight:"right",ArrowUp:"up",ArrowDown:"down"};addEventListener("keydown",e=>{const dir=keyMap[e.key];if(dir){e.preventDefault();move(dir)}});
let startX=0,startY=0,tracking=false;const touchArea=document.getElementById("touch-area");touchArea.addEventListener("pointerdown",e=>{if(e.pointerType==="mouse")return;tracking=true;startX=e.clientX;startY=e.clientY;try{touchArea.setPointerCapture(e.pointerId)}catch(_){}});touchArea.addEventListener("pointerup",e=>{if(!tracking||e.pointerType==="mouse")return;tracking=false;const dx=e.clientX-startX,dy=e.clientY-startY;const ax=Math.abs(dx),ay=Math.abs(dy),threshold=24;if(Math.max(ax,ay)<threshold)return;if(ax>ay)move(dx>0?"right":"left");else move(dy>0?"down":"up")});touchArea.addEventListener("pointercancel",()=>tracking=false);
document.getElementById("new-game").addEventListener("click",()=>{fresh();setStatus("بازی جدید آغاز شد.")});document.getElementById("restart-overlay").addEventListener("click",()=>{fresh();setStatus("بازی جدید آغاز شد.")});document.getElementById("continue-btn").addEventListener("click",()=>{State.keepPlaying=true;hideOverlay();save();setStatus("ادامه بده؛ می‌توانی از 2048 هم عبور کنی.")});
if(load()){Renderer.render();if(State.over)showOverlay("بازی تمام شد",false);setStatus("بازی ذخیره‌شده بازیابی شد.")}else{fresh();setStatus("بازی جدید با دو کاشی آغاز شد.")}
</script>
</body>
</html>
